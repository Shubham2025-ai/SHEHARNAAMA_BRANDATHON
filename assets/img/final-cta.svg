<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-label="A dusk skyline of old Pune with lit arches, domes and temple spires">
  <defs>
    <linearGradient id="fsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3A40"/>
      <stop offset="0.65" stop-color="#4E5A5C"/>
      <stop offset="1" stop-color="#7A6A54"/>
    </linearGradient>
    <radialGradient id="fmoon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F6D8A8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F6D8A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="fgrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.13  0 0 0 0 0.13  0 0 0 0 0.12  0 0 0 0.07 0"/></filter>
  </defs>
  <rect width="1600" height="600" fill="url(#fsky)"/>
  <circle cx="1240" cy="150" r="180" fill="url(#fmoon)"/>
  <circle cx="1240" cy="150" r="52" fill="#F6D8A8"/>
  <g stroke="#8A7A5C" stroke-width="3" opacity="0.7">
    <path d="M180 110 q10 -12 20 0 M240 140 q9 -11 18 0 M420 90 q10 -12 20 0 M980 120 q10 -12 20 0"/>
  </g>

  <!-- skyline silhouettes -->
  <g fill="#33312F">
    <!-- far layer -->
    <path d="M0 420 V340 h70 v-40 h50 v40 h60 V330 h90 v90 Z"/>
    <path d="M300 420 V300 h40 v-36 a26 26 0 0 1 52 0 v36 h40 v120 Z"/>
    <path d="M460 420 V340 h120 v-30 h60 v110 Z"/>
    <path d="M680 420 V320 h44 v-48 a30 30 0 0 1 60 0 v48 h44 v100 Z"/>
    <path d="M860 420 V336 h100 v-40 h70 v124 Z"/>
    <path d="M1060 420 V316 h50 v-40 a28 28 0 0 1 56 0 v40 h44 v104 Z"/>
    <path d="M1240 420 V330 h160 v-34 h70 v124 h60 V360 h70 v60 Z"/>
    <!-- temple spire -->
    <path d="M560 340 l24 -90 l24 90 Z"/>
    <circle cx="584" cy="238" r="7"/>
  </g>

  <!-- near street row -->
  <g fill="#211F1D">
    <rect x="0" y="420" width="1600" height="180"/>
    <path d="M40 420 V380 h90 v40 Z M220 420 V368 h110 v52 Z M420 420 V376 h84 v44 Z M560 420 V360 h130 v60 Z M740 420 V372 h96 v48 Z M930 420 V366 h120 v54 Z M1140 420 V378 h90 v42 Z M1330 420 V364 h120 v56 Z"/>
  </g>
  <!-- lit arches and windows -->
  <g fill="#F6D8A8">
    <path d="M70 420 v-22 a12 12 0 0 1 24 0 v22 Z"/>
    <path d="M252 420 v-28 a14 14 0 0 1 28 0 v28 Z"/>
    <path d="M300 420 v-20 a9 9 0 0 1 18 0 v20 Z"/>
    <path d="M448 420 v-22 a11 11 0 0 1 22 0 v22 Z"/>
    <path d="M586 420 v-30 a16 16 0 0 1 32 0 v30 Z"/>
    <path d="M770 420 v-24 a12 12 0 0 1 24 0 v24 Z"/>
    <path d="M958 420 v-28 a14 14 0 0 1 28 0 v28 Z"/>
    <path d="M1006 420 v-20 a10 10 0 0 1 20 0 v20 Z"/>
    <path d="M1168 420 v-22 a11 11 0 0 1 22 0 v22 Z"/>
    <path d="M1360 420 v-28 a14 14 0 0 1 28 0 v28 Z"/>
    <rect x="248" y="390" width="16" height="12"/>
    <rect x="452" y="392" width="14" height="10"/>
    <rect x="966" y="392" width="14" height="10"/>
  </g>

  <!-- winding route reflection on road -->
  <path d="M80 596 C240 560 200 520 400 520 C600 520 560 566 800 560 C1040 554 1000 592 1280 588"
        fill="none" stroke="#AD6046" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 14" opacity="0.85"/>

  <rect width="1600" height="600" filter="url(#fgrain)"/>
</svg>