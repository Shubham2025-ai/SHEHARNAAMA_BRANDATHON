<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="A close-up of the Sheharnaama Story Passport with stamp rings and a dotted route">
  <defs>
    <linearGradient id="g6bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E3C8"/>
      <stop offset="1" stop-color="#ECDBBD"/>
    </linearGradient>
    <filter id="g6grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.18  0 0 0 0.05 0"/></filter>
  </defs>
  <rect width="600" height="750" fill="url(#g6bg)"/>
  <!-- passport cover, tilted -->
  <g transform="rotate(-5 300 380)">
    <rect x="120" y="90" width="360" height="540" rx="26" fill="#AD6046" stroke="#8C4B36" stroke-width="6"/>
    <rect x="146" y="116" width="308" height="488" rx="18" fill="none" stroke="#F2E6D5" stroke-width="2.5" opacity="0.75"/>
    <!-- embossed arch mark -->
    <path d="M252 330 V282 A48 48 0 0 1 348 282 V330" fill="none" stroke="#8C4B36" stroke-width="6" stroke-linecap="round"/>
    <path d="M242 330 H358" stroke="#8C4B36" stroke-width="6" stroke-linecap="round"/>
    <path d="M268 326 C288 314 312 322 280 300 C262 288 296 294 288 276" fill="none" stroke="#8C4B36" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 8"/>
    <circle cx="288" cy="270" r="6" fill="#667B82"/>
    <!-- title lines -->
    <path d="M200 400 H400 M226 428 H374" stroke="#F2E6D5" stroke-width="7" stroke-linecap="round"/>
    <path d="M246 462 H354" stroke="#F2E6D5" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <!-- stamp rings -->
    <circle cx="220" cy="540" r="42" fill="none" stroke="#F2E6D5" stroke-width="3" stroke-dasharray="5 7" opacity="0.9"/>
    <path d="M220 526 v-9 a11 11 0 0 1 22 0 v9 M212 526 h32 M208 526 v10 h40 v-10" fill="none" stroke="#F2E6D5" stroke-width="3" opacity="0.9"/>
    <circle cx="392" cy="520" r="30" fill="none" stroke="#F2E6D5" stroke-width="3" stroke-dasharray="5 7" opacity="0.75"/>
    <circle cx="392" cy="520" r="14" fill="none" stroke="#F2E6D5" stroke-width="2.5" opacity="0.75"/>
    <!-- dotted route across cover -->
    <path d="M150 600 C230 580 300 610 380 586 C420 575 440 582 460 570" fill="none" stroke="#F2E6D5" stroke-width="3" stroke-dasharray="0.1 10" stroke-linecap="round" opacity="0.85"/>
    <circle cx="462" cy="568" r="6" fill="#667B82"/>
  </g>
  <!-- corner page peeking -->
  <path d="M452 96 l84 30 l-64 30 Z" fill="#F9F6F0" stroke="#C7AD83" stroke-width="3"/>
  <!-- annotation -->
  <ellipse cx="300" cy="370" rx="200" ry="300" fill="none" stroke="#33312F" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.5"/>
  <rect width="600" height="750" filter="url(#g6grain)"/>
</svg>