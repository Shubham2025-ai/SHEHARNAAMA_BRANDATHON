<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="Old stone steps climbing between walls with hanging garlands">
  <defs>
    <linearGradient id="g2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E3C8"/>
      <stop offset="1" stop-color="#ECDBBD"/>
    </linearGradient>
    <filter id="g2grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.18  0 0 0 0.05 0"/></filter>
  </defs>
  <rect width="600" height="750" fill="url(#g2bg)"/>
  <!-- left wall -->
  <polygon points="0,750 0,80 210,220 210,750" fill="#B06A4E" stroke="#8C4B36" stroke-width="3"/>
  <!-- right wall -->
  <polygon points="600,750 600,140 420,260 420,750" fill="#A25B41" stroke="#8C4B36" stroke-width="3"/>
  <!-- steps -->
  <g fill="#E3CFA8" stroke="#B99C74" stroke-width="3">
    <path d="M0 750 L210 640 V690 L0 750 Z"/>
    <path d="M210 640 L420 540 V590 L210 690 Z"/>
    <path d="M420 540 L600 456 V506 L420 600 Z"/>
  </g>
  <!-- garlands across -->
  <path d="M0 300 Q300 380 600 240" fill="none" stroke="#8A6A48" stroke-width="3.5"/>
  <g fill="#AD6046">
    <circle cx="60" cy="316" r="8"/><circle cx="130" cy="332" r="8"/><circle cx="200" cy="344" r="8"/>
    <circle cx="270" cy="350" r="8"/><circle cx="340" cy="348" r="8"/><circle cx="410" cy="338" r="8"/><circle cx="480" cy="316" r="8"/>
  </g>
  <g fill="#667B82">
    <circle cx="95" cy="325" r="5.5"/><circle cx="165" cy="339" r="5.5"/><circle cx="235" cy="348" r="5.5"/>
    <circle cx="305" cy="350" r="5.5"/><circle cx="375" cy="344" r="5.5"/><circle cx="445" cy="328" r="5.5"/>
  </g>
  <!-- lamp on wall -->
  <path d="M110 220 V258" stroke="#33312F" stroke-width="3"/>
  <path d="M96 258 h28 l9 26 q-23 12 -46 0 Z" fill="#33312F"/>
  <circle cx="110" cy="298" r="8" fill="#F6D8A8"/>
  <!-- route up the steps -->
  <path d="M60 720 C160 690 300 640 380 596 C430 570 470 560 540 540" fill="none" stroke="#33312F" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 13"/>
  <circle cx="544" cy="538" r="7" fill="#667B82"/>
  <rect width="600" height="750" filter="url(#g2grain)"/>
</svg>