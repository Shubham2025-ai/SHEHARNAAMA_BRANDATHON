<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="A window sill with a cup of chai and potted plants overlooking a quiet street">
  <defs>
    <linearGradient id="a1bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EAD6"/>
      <stop offset="1" stop-color="#EFE0C6"/>
    </linearGradient>
    <filter id="a1grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.18  0 0 0 0.05 0"/></filter>
  </defs>
  <rect width="640" height="480" fill="url(#a1bg)"/>

  <!-- street view through window -->
  <rect x="90" y="60" width="460" height="280" fill="#F6E3B8" stroke="#8C4B36" stroke-width="8"/>
  <path d="M320 60 V340 M90 200 H550" stroke="#8C4B36" stroke-width="6"/>
  <!-- street below -->
  <path d="M90 300 H550" stroke="#C39B6D" stroke-width="10"/>
  <g fill="#B06A4E">
    <rect x="104" y="212" width="60" height="66"/>
    <rect x="380" y="212" width="150" height="66"/>
  </g>
  <g fill="#667B82" stroke="#4F6169" stroke-width="3">
    <rect x="120" y="228" width="26" height="34"/>
    <rect x="404" y="228" width="30" height="36"/>
    <rect x="452" y="228" width="30" height="36"/>
  </g>
  <circle cx="352" cy="300" r="6" fill="#AD6046"/>
  <!-- distant walker -->
  <g fill="#33312F">
    <circle cx="472" cy="278" r="7"/>
    <path d="M466 286 q6 -4 12 0 l3 18 h-4 l-2 8 h-3 l-1 -8 h-5 Z"/>
  </g>

  <!-- window frame details -->
  <path d="M78 52 h484 M78 52 v296 M562 52 v296" stroke="#5E3E2F" stroke-width="10" fill="none"/>

  <!-- sill -->
  <rect x="60" y="348" width="520" height="22" fill="#8A5A32" stroke="#5E3E2F" stroke-width="3"/>

  <!-- chai cup with steam -->
  <path d="M170 348 v-36 h56 v36" fill="#F2E6D5" stroke="#B99C74" stroke-width="3"/>
  <ellipse cx="198" cy="312" rx="28" ry="7" fill="#C89B62" stroke="#8A5A32" stroke-width="3"/>
  <path d="M226 322 q22 2 0 20" fill="none" stroke="#B99C74" stroke-width="4"/>
  <path d="M186 296 q-8 -12 2 -20 q8 -8 2 -18 M212 296 q-8 -12 2 -20 q8 -8 2 -18" fill="none" stroke="#77716A" stroke-width="3" stroke-linecap="round"/>

  <!-- potted plants -->
  <g>
    <path d="M400 348 l8 -42 h44 l8 42 Z" fill="#AD6046" stroke="#8C4B36" stroke-width="3"/>
    <g stroke="#5E6E4E" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M430 306 q-26 -26 -44 -20 M430 306 q26 -26 44 -20 M430 306 q-8 -36 8 -52 M430 306 q-16 -34 -2 -56"/>
    </g>
  </g>
  <g>
    <path d="M480 348 l6 -30 h36 l6 30 Z" fill="#667B82" stroke="#4F6169" stroke-width="3"/>
    <circle cx="498" cy="306" r="10" fill="#AD6046"/>
    <circle cx="516" cy="300" r="8" fill="#C89B62"/>
  </g>

  <!-- open journal on sill corner -->
  <path d="M96 348 l0 -26 q30 -12 60 0 v26" fill="#F9F6F0" stroke="#77716A" stroke-width="3"/>
  <path d="M126 322 v26 M106 332 q20 -8 40 0" stroke="#AD6046" stroke-width="2.5" fill="none"/>

  <rect width="640" height="480" filter="url(#a1grain)"/>
</svg>