<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="An old wada facade with a carved wooden balcony and an arched gateway in warm light">
  <defs>
    <linearGradient id="xbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E7CE"/>
      <stop offset="1" stop-color="#EFDCC0"/>
    </linearGradient>
    <linearGradient id="xwall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BC7355"/>
      <stop offset="1" stop-color="#A25B41"/>
    </linearGradient>
    <linearGradient id="xwall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B06A4E"/>
      <stop offset="1" stop-color="#93513B"/>
    </linearGradient>
    <radialGradient id="xglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F9DFAF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F9DFAF" stop-opacity="0"/>
    </radialGradient>
    <filter id="xgrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.18  0 0 0 0.05 0"/></filter>
  </defs>
  <rect width="900" height="640" fill="url(#xbg)"/>

  <!-- street receding -->
  <circle cx="640" cy="420" r="150" fill="url(#xglow)"/>
  <polygon points="0,640 240,470 900,470 900,640" fill="#D9B78C"/>
  <g stroke="#C39B6D" stroke-width="3" opacity="0.7">
    <path d="M210 500 H860 M190 545 H880 M170 596 H900"/>
  </g>

  <!-- far lane -->
  <rect x="600" y="330" width="150" height="140" fill="#E2C095"/>
  <path d="M636 470 V400 A39 39 0 0 1 714 400 V470 Z" fill="#FBEBc6"/>

  <!-- main wada -->
  <polygon points="0,640 0,80 560,80 560,470 300,470 240,640" fill="url(#xwall)"/>
  <rect x="0" y="80" width="560" height="24" fill="#8C4B36"/>
  <path d="M0 152 H560" stroke="#8C4B36" stroke-width="3" opacity="0.5"/>
  <!-- balcony -->
  <path d="M120 260 H420 M120 260 V330 M420 260 V330" stroke="#5E3E2F" stroke-width="8" fill="none"/>
  <g stroke="#5E3E2F" stroke-width="4">
    <path d="M140 268 V326 M170 268 V326 M200 268 V326 M230 268 V326 M260 268 V326 M290 268 V326 M320 268 V326 M350 268 V326 M380 268 V326 M400 268 V326"/>
  </g>
  <path d="M128 330 H412" stroke="#4A2F23" stroke-width="9"/>
  <g stroke="#F2E6D5" stroke-width="3" opacity="0.85">
    <path d="M150 268 q12 22 0 44 M240 268 q12 22 0 44 M330 268 q12 22 0 44"/>
  </g>
  <!-- balcony door + windows -->
  <path d="M240 260 V158 A38 38 0 0 1 316 158 V260" fill="#5E3E2F" stroke="#4A2F23" stroke-width="4"/>
  <path d="M278 158 V260" stroke="#4A2F23" stroke-width="3.5"/>
  <g fill="#667B82" stroke="#4F6169" stroke-width="3">
    <path d="M60 250 V196 A24 24 0 0 1 108 196 V250 Z"/>
    <path d="M380 250 V196 A24 24 0 0 1 428 196 V250 Z"/>
  </g>
  <path d="M84 178 V246 M404 178 V246" stroke="#F2E6D5" stroke-width="2.5"/>
  <!-- ground gateway -->
  <path d="M120 640 V510 A76 76 0 0 1 272 510 V640 Z" fill="#5E3E2F"/>
  <path d="M136 640 V516 A60 60 0 0 1 256 516 V640 Z" fill="#6E4A38"/>
  <path d="M196 516 V640" stroke="#4A2F23" stroke-width="3.5"/>
  <circle cx="228" cy="576" r="6" fill="#C89B62"/>
  <!-- hanging garland -->
  <path d="M20 300 Q300 360 560 300" fill="none" stroke="#8A6A48" stroke-width="3"/>
  <g fill="#AD6046">
    <circle cx="60" cy="310" r="7"/><circle cx="110" cy="318" r="7"/><circle cx="160" cy="324" r="7"/>
    <circle cx="210" cy="328" r="7"/><circle cx="260" cy="330" r="7"/><circle cx="310" cy="330" r="7"/>
    <circle cx="360" cy="328" r="7"/><circle cx="410" cy="324" r="7"/><circle cx="460" cy="318" r="7"/><circle cx="510" cy="312" r="7"/>
  </g>
  <g fill="#667B82">
    <circle cx="85" cy="315" r="5"/><circle cx="185" cy="327" r="5"/><circle cx="285" cy="331" r="5"/><circle cx="385" cy="327" r="5"/><circle cx="485" cy="316" r="5"/>
  </g>

  <!-- neighbour wall right -->
  <polygon points="900,640 900,300 760,330 760,470 900,470" fill="url(#xwall2)"/>
  <path d="M790 470 V400 A30 30 0 0 1 850 400 V470" fill="#667B82" stroke="#4F6169" stroke-width="4"/>
  <g fill="#8A4A36">
    <ellipse cx="700" cy="452" rx="16" ry="22"/>
    <ellipse cx="732" cy="458" rx="12" ry="17"/>
  </g>

  <!-- route -->
  <path d="M60 616 C150 560 90 520 180 500 C260 484 200 430 300 420" fill="none" stroke="#33312F" stroke-width="5" stroke-linecap="round" stroke-dasharray="0.1 14"/>
  <circle cx="306" cy="418" r="7" fill="#667B82"/>

  <rect width="900" height="640" filter="url(#xgrain)"/>
</svg>