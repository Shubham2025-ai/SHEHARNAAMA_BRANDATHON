<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" role="img" aria-label="Stacks of glass bangles, thread spools and scissors on a craft table">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E3C8"/>
      <stop offset="1" stop-color="#ECDBBD"/>
    </linearGradient>
    <filter id="cgrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.18  0 0 0 0.05 0"/></filter>
  </defs>
  <rect width="640" height="800" fill="url(#cbg)"/>

  <!-- hanging bangle strings -->
  <g stroke="#33312F" stroke-width="3">
    <path d="M140 60 V180 M220 60 V140 M300 60 V210 M420 60 V150 M500 60 V190"/>
  </g>
  <g fill="none" stroke-width="9">
    <ellipse cx="140" cy="200" rx="26" ry="30" stroke="#AD6046"/>
    <ellipse cx="140" cy="232" rx="26" ry="30" stroke="#C89B62"/>
    <ellipse cx="140" cy="264" rx="26" ry="30" stroke="#667B82"/>
    <ellipse cx="220" cy="158" rx="24" ry="28" stroke="#667B82"/>
    <ellipse cx="220" cy="188" rx="24" ry="28" stroke="#AD6046"/>
    <ellipse cx="300" cy="228" rx="26" ry="30" stroke="#C89B62"/>
    <ellipse cx="300" cy="260" rx="26" ry="30" stroke="#AD6046"/>
    <ellipse cx="300" cy="292" rx="26" ry="30" stroke="#667B82"/>
    <ellipse cx="420" cy="168" rx="24" ry="28" stroke="#AD6046"/>
    <ellipse cx="420" cy="198" rx="24" ry="28" stroke="#C89B62"/>
    <ellipse cx="500" cy="208" rx="26" ry="30" stroke="#667B82"/>
    <ellipse cx="500" cy="240" rx="26" ry="30" stroke="#AD6046"/>
    <ellipse cx="500" cy="272" rx="26" ry="30" stroke="#C89B62"/>
  </g>

  <!-- table -->
  <rect x="60" y="470" width="520" height="26" fill="#8A5A32" stroke="#5E3E2F" stroke-width="3"/>
  <path d="M100 496 L88 740 M540 496 L552 740" stroke="#5E3E2F" stroke-width="10" stroke-linecap="round"/>

  <!-- spools -->
  <g stroke="#8A5A32" stroke-width="3">
    <rect x="120" y="404" width="52" height="66" fill="#F2E6D5"/>
    <rect x="120" y="416" width="52" height="10" fill="#AD6046"/>
    <rect x="120" y="440" width="52" height="10" fill="#AD6046"/>
    <rect x="196" y="392" width="46" height="78" fill="#F2E6D5"/>
    <rect x="196" y="404" width="46" height="9" fill="#667B82"/>
    <rect x="196" y="426" width="46" height="9" fill="#667B82"/>
    <rect x="196" y="448" width="46" height="9" fill="#667B82"/>
  </g>
  <path d="M172 470 C200 430 190 410 230 400" fill="none" stroke="#AD6046" stroke-width="4"/>
  <path d="M242 470 C270 440 260 428 288 414" fill="none" stroke="#667B82" stroke-width="4"/>

  <!-- loose bangles on table -->
  <g fill="none" stroke-width="8">
    <ellipse cx="360" cy="452" rx="34" ry="20" stroke="#AD6046"/>
    <ellipse cx="410" cy="458" rx="34" ry="20" stroke="#667B82"/>
    <ellipse cx="388" cy="438" rx="34" ry="20" stroke="#C89B62"/>
  </g>

  <!-- scissors -->
  <g stroke="#33312F" stroke-width="7" stroke-linecap="round">
    <path d="M470 430 L540 388 M470 400 L540 442"/>
    <circle cx="456" cy="426" r="12" fill="none"/>
    <circle cx="456" cy="404" r="12" fill="none"/>
  </g>

  <!-- cloth with weave -->
  <rect x="140" y="540" width="360" height="150" fill="#E8D3B4" stroke="#B99C74" stroke-width="3"/>
  <g stroke="#AD6046" stroke-width="4">
    <path d="M160 566 h320 M160 594 h320 M160 622 h320 M160 650 h320"/>
  </g>
  <g stroke="#667B82" stroke-width="4" opacity="0.7">
    <path d="M196 552 v126 M260 552 v126 M324 552 v126 M388 552 v126 M452 552 v126"/>
  </g>

  <!-- annotation -->
  <ellipse cx="300" cy="620" rx="230" ry="120" fill="none" stroke="#33312F" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round"/>
  <path d="M530 620 q44 0 44 36 v60" fill="none" stroke="#33312F" stroke-width="2.5" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="574" cy="720" r="6" fill="#AD6046"/>

  <rect width="640" height="800" filter="url(#cgrain)"/>
</svg>