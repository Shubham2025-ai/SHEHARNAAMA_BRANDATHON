<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1040" role="img" aria-label="A narrow old Pune lane with terracotta walls, wooden doorways and warm light at its end">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E7CE"/>
      <stop offset="1" stop-color="#EFDCC0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F9DFAF" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#F4D5A0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F4D5A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A85F44"/>
      <stop offset="1" stop-color="#93513B"/>
    </linearGradient>
    <linearGradient id="wallR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A65C42"/>
      <stop offset="1" stop-color="#BC7355"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0BE92"/>
      <stop offset="1" stop-color="#D3AE80"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.18  0 0 0 0.05 0"/></filter>
  </defs>

  <rect width="800" height="1040" fill="url(#sky)"/>
  <circle cx="400" cy="600" r="300" fill="url(#glow)"/>
  <path d="M120 150 q10 -12 20 0 M160 175 q9 -11 18 0 M640 130 q10 -12 20 0" stroke="#B99C74" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- far wall + glowing arch -->
  <rect x="240" y="430" width="320" height="230" fill="#E2C095"/>
  <path d="M322 660 V556 A78 78 0 0 1 478 556 V660 Z" fill="#FBEBc6"/>
  <path d="M322 660 V556 A78 78 0 0 1 478 556 V660" fill="none" stroke="#C79E6C" stroke-width="5"/>
  <circle cx="400" cy="580" r="80" fill="url(#glow)"/>

  <!-- left building -->
  <polygon points="0,1040 0,190 150,258 240,430 240,660 240,1040" fill="url(#wallL)"/>
  <g stroke="#7C4231" stroke-width="3" fill="#F2E6D5">
    <path d="M60 388 V326 A34 34 0 0 1 128 326 V388 Z"/>
    <path d="M158 496 V440 A27 27 0 0 1 212 440 V496 Z"/>
    <path d="M212 584 V538 A21 21 0 0 1 254 538 V584 Z"/>
  </g>
  <g fill="#667B82">
    <path d="M70 380 V330 A24 24 0 0 1 118 330 V380 Z"/>
    <path d="M166 488 V444 A19 19 0 0 1 204 444 V488 Z"/>
    <path d="M218 576 V542 A15 15 0 0 1 248 542 V576 Z"/>
  </g>
  <g stroke="#F2E6D5" stroke-width="3">
    <path d="M94 310 V384 M118 312 V384" opacity="0.85"/>
    <path d="M185 428 V486 M203 430 V486" opacity="0.85"/>
  </g>
  <path d="M76 876 V772 A52 52 0 0 1 180 772 V876 Z" fill="#5E3E2F"/>
  <path d="M128 772 V876 M94 772 A34 34 0 0 0 128 738 A34 34 0 0 0 162 772" fill="none" stroke="#4A2F23" stroke-width="4"/>
  <circle cx="146" cy="822" r="6" fill="#C89B62"/>
  <path d="M60 876 H196 M52 892 H204" stroke="#8A4A36" stroke-width="7" stroke-linecap="round"/>

  <!-- right building -->
  <polygon points="800,1040 800,150 664,226 560,430 560,660 560,1040" fill="url(#wallR)"/>
  <path d="M676 388 V320 A36 36 0 0 1 748 320 V388 Z" fill="#F2E6D5" stroke="#7C4231" stroke-width="3"/>
  <path d="M686 380 V326 A26 26 0 0 1 738 326 V380 Z" fill="#667B82"/>
  <path d="M712 302 V384 M694 318 V384" stroke="#F2E6D5" stroke-width="3" opacity="0.85"/>
  <!-- shop awning -->
  <path d="M560 690 H800 V668 A10 10 0 0 0 790 658 H570 A10 10 0 0 0 560 668 Z" fill="#667B82"/>
  <g fill="#F2E6D5">
    <rect x="584" y="658" width="26" height="32"/>
    <rect x="636" y="658" width="26" height="32"/>
    <rect x="688" y="658" width="26" height="32"/>
    <rect x="740" y="658" width="26" height="32"/>
  </g>
  <path d="M560 690 q15 12 30 0 q15 12 30 0 q15 12 30 0 q15 12 30 0 q15 12 30 0 q15 12 30 0 q15 12 30 0 q15 12 30 0" fill="none" stroke="#57676E" stroke-width="3"/>
  <rect x="588" y="712" width="190" height="120" fill="#54392C"/>
  <path d="M588 752 H778 M588 792 H778" stroke="#6E4A38" stroke-width="5"/>
  <g fill="#C89B62">
    <circle cx="620" cy="742" r="12"/><circle cx="652" cy="742" r="10"/>
    <circle cx="636" cy="782" r="12"/><circle cx="700" cy="742" r="9"/>
    <circle cx="684" cy="782" r="11"/><circle cx="740" cy="782" r="10"/>
  </g>
  <path d="M664 470 h44 v34 h-44 z" fill="#F2E6D5" stroke="#7C4231" stroke-width="3"/>
  <path d="M672 487 h28 M686 478 v18" stroke="#AD6046" stroke-width="4"/>
  <!-- matka pots -->
  <g fill="#8A4A36">
    <path d="M586 1000 q-26 -40 0 -66 q26 26 0 66 Z" transform="translate(6 0)"/>
    <ellipse cx="636" cy="972" rx="20" ry="26"/>
    <ellipse cx="676" cy="984" rx="15" ry="20"/>
  </g>
  <ellipse cx="636" cy="952" rx="8" ry="5" fill="#5E3E2F"/>
  <ellipse cx="676" cy="968" rx="6" ry="4" fill="#5E3E2F"/>

  <!-- laundry line -->
  <path d="M110 244 Q400 296 690 236" fill="none" stroke="#8A6A48" stroke-width="3.5"/>
  <g stroke="#33312F" stroke-width="2.5" stroke-linejoin="round">
    <path d="M212 262 l30 -2 l6 52 q-21 12 -42 0 Z" fill="#F2E6D5"/>
    <path d="M336 276 l26 -2 l5 44 q-18 11 -36 0 Z" fill="#667B82"/>
    <path d="M546 264 l28 -2 l6 50 q-20 12 -40 0 Z" fill="#E8D3B4"/>
  </g>

  <!-- lane floor -->
  <polygon points="240,1040 240,660 560,660 560,1040" fill="url(#floor)"/>
  <g stroke="#C39B6D" stroke-width="3" opacity="0.7">
    <path d="M262 720 H538 M272 776 H528 M280 836 H520 M288 902 H512 M296 972 H504"/>
  </g>
  <g stroke="#B78C60" stroke-width="3" fill="none" opacity="0.55">
    <ellipse cx="320" cy="860" rx="26" ry="8"/>
    <ellipse cx="470" cy="908" rx="30" ry="9"/>
    <ellipse cx="390" cy="972" rx="34" ry="10"/>
  </g>

  <!-- winding route -->
  <path d="M404 1004 C336 936 470 880 400 806 C344 748 448 706 400 664"
        fill="none" stroke="#33312F" stroke-width="6" stroke-linecap="round" stroke-dasharray="0.1 16"/>

  <!-- two walkers -->
  <g fill="#3B3835">
    <circle cx="382" cy="742" r="11"/>
    <path d="M370 756 q12 -8 24 0 l6 46 h-10 l-3 26 h-8 l-2 -26 h-10 Z"/>
    <circle cx="422" cy="782" r="10"/>
    <path d="M412 794 q10 -7 20 0 l6 42 h-9 l-3 24 h-7 l-2 -24 h-9 Z"/>
  </g>

  <rect width="800" height="1040" filter="url(#grain)"/>
</svg>