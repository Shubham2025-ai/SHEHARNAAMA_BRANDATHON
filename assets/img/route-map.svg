<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="A stylised map of winding neighbourhood lanes with five numbered stops">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7EDDA"/>
      <stop offset="1" stop-color="#F1E3CB"/>
    </linearGradient>
    <filter id="mgrain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="matrix" values="0 0 0 0 0.2  0 0 0 0 0.19  0 0 0 0 0.18  0 0 0 0.04 0"/></filter>
  </defs>
  <rect width="1200" height="420" rx="18" fill="url(#mbg)" stroke="#D8C4A4" stroke-width="2"/>

  <!-- abstract lane grid -->
  <g stroke="#DFCBA8" stroke-width="14" stroke-linecap="round" opacity="0.8">
    <path d="M40 90 H460 M560 60 V300 M700 100 H1160 M40 300 H420 M900 40 V200 M240 140 V380 M1050 260 V400 M620 360 H840"/>
  </g>
  <g stroke="#E9D8B8" stroke-width="6" stroke-linecap="round">
    <path d="M40 180 H340 M480 340 H580 M760 200 H1000 M140 380 V420 M1120 100 V200"/>
  </g>

  <!-- landmark hints -->
  <g fill="none" stroke="#C7AD83" stroke-width="4">
    <path d="M180 240 v-26 a16 16 0 0 1 32 0 v26 M172 240 h48"/>
    <path d="M820 60 v-22 a14 14 0 0 1 28 0 v22 M812 60 h44" transform="translate(0 40)"/>
    <circle cx="1050" cy="180" r="20"/>
    <path d="M1050 160 v-16 M1044 150 h12" />
  </g>

  <!-- the route -->
  <path d="M110 330 C220 300 180 210 300 210 C430 210 400 130 540 140 C680 150 660 260 780 260 C900 260 880 170 1010 170 C1090 170 1080 320 1100 350"
        fill="none" stroke="#AD6046" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 15"/>

  <!-- five stops -->
  <g font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" text-anchor="middle">
    <circle cx="110" cy="330" r="24" fill="#33312F"/>
    <text x="110" y="338" fill="#F9F6F0">1</text>
    <circle cx="300" cy="210" r="24" fill="#33312F"/>
    <text x="300" y="218" fill="#F9F6F0">2</text>
    <circle cx="540" cy="140" r="24" fill="#33312F"/>
    <text x="540" y="148" fill="#F9F6F0">3</text>
    <circle cx="780" cy="260" r="24" fill="#33312F"/>
    <text x="780" y="268" fill="#F9F6F0">4</text>
    <circle cx="1100" cy="350" r="24" fill="#AD6046"/>
    <text x="1100" y="358" fill="#F9F6F0">5</text>
  </g>

  <rect width="1200" height="420" rx="18" filter="url(#mgrain)"/>
</svg>